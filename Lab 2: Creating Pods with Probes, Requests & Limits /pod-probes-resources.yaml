apiVersion: v1
kind: Pod
metadata:
  name: demo-probes-pod
  labels:
    app: probe-demo
spec:
  containers:
  - name: web-app
    image: nginx:alpine
    ports:
    - containerPort: 80
    
    # 1. Resource Requests and Limits tailored for small VMs / K3s nodes
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "250m"

    # 2. Startup Probe: Ensures initialization complete before checking readiness/liveness
    startupProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 10

    # 3. Readiness Probe: Controls service traffic routing
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    # 4. Liveness Probe: Triggers container restarts upon application crash/freeze
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
