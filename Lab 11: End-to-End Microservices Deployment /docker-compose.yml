version: "3.8"

services:
  # --- Node.js Application ---
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smallsteps-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - app-data:/app/data
    networks:
      - smallsteps-net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- MongoDB Database ---
  mongo:
    image: mongo:7
    container_name: smallsteps-mongo
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-smallsteps}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS:-smallsteps_pass}
      - MONGO_INITDB_DATABASE=smallsteps
    volumes:
      - mongo-data:/data/db
    networks:
      - smallsteps-net
    healthcheck:
      test: mongosh --username ${MONGO_USER:-smallsteps} --password ${MONGO_PASS:-smallsteps_pass} --authenticationDatabase admin --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: smallsteps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/www:ro
      - nginx-logs:/var/log/nginx
    networks:
      - smallsteps-net
    depends_on:
      - app

# --- Volumes ---
volumes:
  app-data:
  mongo-data:
  nginx-logs:

# --- Custom Network ---
networks:
  smallsteps-net:
    driver: bridge
