apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smallsteps

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

        - name: backend

          image: smallsteps-backend:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: smallsteps-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: smallsteps-config
                  key: PORT

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smallsteps-secret
                  key: JWT_SECRET

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: smallsteps-secret
                  key: MONGODB_URI

          startupProbe:
            httpGet:
              path: /api/health
              port: http

            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 20

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: smallsteps

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      port: 3000
      targetPort: http
